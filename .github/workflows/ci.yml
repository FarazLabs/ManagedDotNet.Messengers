name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test ManagedDotNet.Messengers.sln -c Release --verbosity normal

  publish:
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        run: |
          dotnet pack src/ManagedDotNet.Messengers.csproj -c Release -p:GeneratePackageOnBuild=false
          ls -la src/nupkgs

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "src/nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/FarazLabs/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
